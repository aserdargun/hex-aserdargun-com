      <main>
        <h1>HEX — Humanoid Engineering Explorer</h1>
        <p>
          An interactive 3D learning object for humanoid engineering: how structure, joints,
          actuation, sensing, power and compute fit together as one connected system. Interface
          available in English and Turkish. Runs entirely in your browser.
        </p>
        <p>
          <strong>Scope:</strong> the robot is Blender-authored teaching geometry. Movement is
          kinematic teaching motion — there is no dynamics simulation, no inverse-kinematics
          solver, no trained policy and no measured robot telemetry. Material families and
          mechanisms are illustrative; no load limit, alloy grade, torque, ratio or controller
          frequency is certified.
        </p>
        <h2>What it covers</h2>
        <ul>
          <li>Ten modes: explore, structure, joints, actuation, sensors, power, compute, perception, control and behavior.</li>
          <li>Exploded views, joint axes, and COM/CoP overlays, explicitly marked as illustrative.</li>
          <li>From matter to intelligence — a guided lesson over the same components.</li>
          <li>The assumptions behind each view, and the references each lesson draws on.</li>
        </ul>
      </main>
